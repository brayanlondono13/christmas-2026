<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Breckenridge 2026</title>
<meta name="description" content="Family Christmas 2026 in Breckenridge: the plan, your Friday pick, and your own days.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Manrope:wght@400..800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..600;1,8..60,400..600&display=swap" rel="stylesheet">
<style>
:root{
  --page:#EFEAE4; --card:#FAFAF9; --ink:#1C1917; --muted:#524D49; --line:#E7E2DC; --line2:#EFEAE4; --line3:#DDD6CE; --sand:#F5F0EB;
  --accent:#783907; --green:#365314; --red:#7F1D1D; --ghost:#D6CFC7; --num:#D6CFC7;
  --sans:Manrope,system-ui,sans-serif; --serif:'Source Serif 4',Georgia,serif; --display:Fraunces,Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
input{outline:none;font:inherit}
button{font:inherit;cursor:pointer;background:none;border:0;padding:0;color:inherit}
button,a,.person,.chip,.choice,.radio,.btn{touch-action:manipulation}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.rise{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}

/* type */
.eyebrow{font-family:var(--sans);font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--accent)}
.eyebrow.muted{color:var(--muted)}
.h1{font-family:var(--display);font-size:40px;font-weight:500;letter-spacing:-.01em;line-height:1.05;margin-top:8px}
.h1 em{font-style:italic;font-weight:300}
.lede{font-family:var(--serif);font-size:15px;line-height:1.55;color:var(--muted);margin-top:10px;text-wrap:pretty}
.label{font-family:var(--sans);font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.tiny{font-family:var(--sans);font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.ext{color:var(--ink);text-decoration:underline;text-underline-offset:2px;white-space:nowrap}

/* phone shell */
.shell{max-width:480px;margin:0 auto;min-height:100vh;background:var(--card);display:flex;flex-direction:column}
@media(min-width:481px){.shell{border-left:1px solid var(--line3);border-right:1px solid var(--line3)}}
.shell.nav{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:5;background:rgba(250,250,249,.85);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .bar{display:flex;justify-content:space-between;align-items:center;padding:14px 20px}
.brand{font-family:var(--display);font-style:italic;font-size:17px}
.top .brand{cursor:pointer;padding:12px 0;margin:-12px 0}
.top .r{display:flex;align-items:center;gap:14px}
.top .topname{font-family:var(--sans);font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:14px 0;margin:-14px 0;cursor:pointer}   /* 44px to tap, without making the bar taller */
.top .topname b{color:var(--ink);font-weight:600}
.todo{background:var(--sand);border-top:1px solid var(--line);padding:9px 20px;font-size:12px;line-height:1.4;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.todo a{text-decoration:underline;text-underline-offset:2px;cursor:pointer;padding:10px 0}
.todo.done{color:var(--green);font-weight:600}
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
@media(min-width:481px){.tabbar{border-left:1px solid var(--line3);border-right:1px solid var(--line3)}}
.tabbar a{flex:1;height:56px;display:flex;align-items:center;justify-content:center;font-family:var(--sans);font-size:11px;font-weight:600;color:var(--muted)}
.tabbar a span{padding:4px 2px;border-bottom:2px solid transparent}
.tabbar a.on{color:var(--ink)}
.tabbar a.on span{border-bottom-color:var(--green)}
.pad{padding:28px 20px 40px}
section[id]{scroll-margin-top:100px}

/* who's this */
.who{padding:56px 24px 32px;min-height:100vh;display:flex;flex-direction:column}
.who .h1{font-size:42px;margin-top:10px}
.hh{margin-top:18px}
.hh-h{display:flex;gap:6px;align-items:baseline;padding-bottom:6px;border-bottom:1px solid var(--line);font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.hh-h .fam{color:var(--muted)}
.person{display:flex;justify-content:space-between;align-items:center;min-height:44px;border-bottom:1px solid var(--line2);cursor:pointer;font-size:16px;font-weight:500;width:100%;text-align:left}
.person:hover{background:var(--sand)}
.person.kid{padding-left:16px}
.who-foot{margin-top:auto;padding-top:32px;text-align:center;font-size:12px;color:var(--muted)}
.who-foot a{color:var(--ink);text-decoration:underline;cursor:pointer;padding:12px 0}

/* trip info */
.facts{margin-top:22px;font-size:14px;font-weight:600;letter-spacing:.01em}
.copy{font-family:var(--serif);font-size:15px;line-height:1.6;color:var(--ink);margin-top:20px;text-wrap:pretty}
.box{margin-top:32px;border:1px solid var(--line);padding:16px 16px 14px}
.box p{font-family:var(--serif);font-size:15px;line-height:1.55;margin:8px 0 0}
.assume{margin-top:30px}
.assume h3{font-family:var(--sans);font-size:14px;font-weight:600;margin:0 0 10px}
.assume ul{margin:0;padding-left:18px}
.assume li{font-family:var(--serif);font-size:15px;line-height:1.55;margin:0 0 9px;text-wrap:pretty}

/* choose */
.day{padding:26px 20px 14px}
.day-h{display:flex;align-items:baseline;gap:14px}
.daynum{font-family:var(--display);font-size:44px;font-weight:300;color:var(--num);line-height:1;letter-spacing:-.02em}
.dayname{font-family:var(--display);font-size:22px;font-weight:500;line-height:1.1}
.daydate{margin-top:4px}
.grp{margin-top:16px}
.grp+.grp{margin-top:22px}
.grp-h{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:6px;border-bottom:1px solid var(--line);font-size:13px;font-weight:700;color:var(--muted)}
.grp-h.all{border-bottom:1.5px solid var(--ink);color:var(--ink)}
.grp-h.ask{color:var(--accent)}
.grp-h .sub{font-weight:500;font-size:12px;color:var(--muted)}
.lrow{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:11px 0;border-bottom:1px dotted var(--line3)}
.lrow b{display:block;font-size:14px;font-weight:600;line-height:1.35}
.lrow i{display:block;font-family:var(--serif);font-style:normal;font-size:13px;line-height:1.5;color:var(--muted);margin-top:1px}
.lrow .tiny{flex:none}
.cards{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:4px;padding:14px 14px 12px}
.card.mine{border-color:var(--green);background:#F3F5EE}
.card.dim{opacity:.5}
.card-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.card-name{font-size:15px;font-weight:600;line-height:1.3;padding-top:1px}
.card-price{flex:none;text-align:right;font-size:13px;font-weight:600;line-height:1.3}
.card-price .amt{font-size:15px}
.card-price .ontop{font-size:13px;font-weight:600;color:var(--muted);margin-left:4px}
.card-desc{font-family:var(--serif);font-size:14px;line-height:1.5;color:var(--muted);margin-top:6px}
.card-extra{font-family:var(--serif);font-size:13px;line-height:1.5;color:var(--ink);margin-top:6px}
.card-cons{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5}
.card-going{font-size:12px;margin-top:8px;line-height:1.5;color:var(--muted)}
.card-due{font-size:12px;color:var(--muted);margin-top:4px}
.card-due .ext{display:inline-block;padding:8px 0}
.radios{display:flex;gap:14px;margin-top:10px;flex-wrap:wrap}
.radio{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink);cursor:pointer;min-height:44px}
.radio i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--ink);display:inline-block;flex:none;position:relative}
.radio.on i::after{content:'';position:absolute;inset:2.5px;border-radius:50%;background:var(--ink)}
.radio.dis{color:var(--muted);cursor:default}
.radio.dis i{border-color:var(--ghost)}
.btn{margin-top:12px;width:100%;height:44px;display:flex;align-items:center;justify-content:center;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;text-align:center;padding:0 12px;border:1px solid var(--ink);color:var(--ink);background:transparent;cursor:pointer}
.btn.in{color:var(--card);background:var(--green);border-color:var(--green)}
.btn.full{color:var(--accent);border-color:var(--accent);text-transform:none;letter-spacing:0;font-size:13px;font-weight:600}
.btn.unlock{width:180px;margin:14px auto 0}
.btn.kid{color:var(--ink)}
.btn.off{color:var(--muted);border-color:var(--ghost);cursor:default}
.btn:disabled{cursor:default}
.btn.off.sent{text-transform:none;letter-spacing:0;font-size:12px;font-weight:600;line-height:1.3}
.rm{display:block;margin:2px auto 0;font-size:12px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:10px 12px}
.pill{display:inline-block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--green);border:1px solid var(--green);padding:3px 9px;border-radius:999px}
.pill.closed{color:var(--muted);border-color:var(--ghost)}
.pills{margin-top:12px;display:flex}
.note{font-family:var(--serif);font-size:13px;line-height:1.55;color:var(--muted);margin-top:14px;text-wrap:pretty}
.final{font-family:var(--serif);font-size:14px;line-height:1.5;margin-top:10px;font-weight:600;text-wrap:pretty}
.final.soft{font-weight:400;color:var(--muted)}
.daynote{font-family:var(--serif);font-size:13px;line-height:1.5;color:var(--muted);margin-top:10px;text-wrap:pretty}
.vrow{padding:11px 0 6px;border-bottom:1px dotted var(--line3)}
.vrow-h{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.vrow-h b{font-size:14px;font-weight:600;line-height:1.35}
.vrow-r{flex:none;font-size:12px;color:var(--muted)}
.vrow-note{font-family:var(--serif);font-size:13px;line-height:1.5;color:var(--muted);margin-top:4px}
.vrow.kid .choice{opacity:.5}
.crow{display:flex;gap:12px;align-items:flex-start}
.crow .ext{flex:none;margin-top:6px;padding:8px 0;font-size:12px;font-weight:600}
.choice{margin-top:10px;display:block;flex:1;min-width:0;text-align:left}
.choice.can{cursor:pointer}
.choice-l{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px}
.choice-l .lbl{display:flex;align-items:center;gap:9px;min-width:0}
.choice-l .dot{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--ink);flex:none;position:relative}
.choice.my .dot::after{content:'';position:absolute;inset:2.5px;border-radius:50%;background:var(--green)}
.choice-l .r{display:flex;gap:10px;align-items:baseline}
.choice-l .you{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--green);font-weight:700}
.choice-d{font-family:var(--serif);font-size:12px;line-height:1.4;color:var(--muted);margin-top:1px}
.choice.my .choice-l{font-weight:700}
.meter{height:3px;background:var(--line2);margin-top:5px;border-radius:2px}
.meter i{display:block;height:3px;background:var(--green);border-radius:2px;transition:width .3s}
.meal{padding:11px 0 10px;border-bottom:1px dotted var(--line3)}
.meal-h{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.meal-h b{font-size:14px;font-weight:600;line-height:1.35}
.roles{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.role{display:flex;align-items:center;gap:8px}
.role>span{min-width:72px;flex:none;font-size:12px;color:var(--muted)}
.meal-note{font-family:var(--serif);font-size:13px;line-height:1.5;color:var(--muted);margin-top:4px;text-wrap:pretty}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;min-height:44px;font-size:12px;font-weight:600;padding:0 14px;border-radius:999px;line-height:1.4;background:var(--sand);color:var(--ink);border:1px solid transparent;cursor:default}
.chip.me{border-color:var(--green);cursor:pointer}
.chip.open{background:transparent;color:var(--muted);border:1px dashed var(--ghost)}
.chip.can{cursor:pointer}

/* my trip */
.money{margin-top:22px;border:1px solid var(--line);padding:14px;font-size:14px;font-weight:600;line-height:1.5}
.money small{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:2px}
.itin{padding:26px 20px 10px;border-top:1px solid var(--line)}
.itin .rows{margin-top:12px;border-top:1px solid var(--line)}
.it{display:grid;grid-template-columns:76px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line2)}
.it .t{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.4}
.it .k{font-family:var(--display);font-style:italic;font-size:13px;margin-top:3px;color:var(--muted)}
.it b{display:block;font-size:15px;font-weight:600;line-height:1.35}
.it b a{text-decoration:underline;text-underline-offset:3px}
.it i{display:block;font-family:var(--serif);font-style:normal;font-size:14px;line-height:1.5;color:var(--muted);margin-top:2px}
.kv{display:flex;gap:8px;margin-top:8px;font-size:11px;line-height:1.5}
.kv+.kv{margin-top:3px}
.kv span{width:76px;flex:none;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kv em{font-style:normal;color:var(--ink)}

/* planner */
.pshell{min-height:100vh;background:var(--card);display:flex;flex-direction:column}
.pbar{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:22px 36px;background:var(--red);color:var(--card);flex:none}
.pbar .brand{font-size:20px}
.pbar .sub{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;opacity:.8;margin-left:18px}
.pbar .r{display:flex;align-items:center;gap:24px;font-size:12px}
.pbar .lock{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;border:1px solid rgba(250,250,249,.5);padding:6px 10px;cursor:pointer;color:inherit}
.gate{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px}
.gate>div{width:360px;text-align:center}
.pin{margin-top:24px;width:180px;padding:12px 0;text-align:center;font-size:28px;letter-spacing:.5em;font-weight:600;background:#fff;border:1px solid var(--line3);border-radius:4px}
.hint{font-family:var(--serif);font-size:14px;line-height:1.5;color:var(--muted);margin-top:14px}
.hint.err{color:var(--accent)}
.back{font-size:13px;text-decoration:underline;text-underline-offset:3px;padding:12px 0}
.pnote.laptop{display:none}
@media(max-width:1179px){.pnote.laptop{display:block;margin-top:18px}}
.pgrid{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:32px;padding:32px 36px 40px;min-width:1180px}
.pmain{min-width:0}
.ptable{margin-top:12px;border-top:1px solid var(--ink)}
.prow{display:grid;grid-template-columns:minmax(0,1fr) 78px 136px 104px 170px;gap:10px;padding:12px 0;border-bottom:1px solid var(--line2);align-items:center;font-size:12px}
.prow.h{padding:10px 0;border-bottom:1px solid var(--line)}
.prow .name b{display:block;font-weight:600}
.prow .name i{display:block;font-style:normal;color:var(--muted);font-size:11px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--sand);white-space:nowrap}
.tag.booked{color:var(--green)}
.tag.locked{color:var(--red)}
.conf{width:100%;font-size:12px;font-variant-numeric:tabular-nums;padding:5px 6px;border:1px solid var(--line);border-radius:3px;background:#fff}
.acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.act{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--ink);border:1px solid var(--ink);padding:5px 8px;cursor:pointer;white-space:nowrap}
.act.soft{color:var(--muted);border-color:var(--ghost)}
.act.x{padding:2px 5px;border-color:transparent;color:var(--muted)}
.act.x:hover{color:var(--red)}
.sec{margin-top:36px}
.vlist{margin-top:12px;border-top:1px solid var(--ink)}
.vl{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px 0;border-bottom:1px solid var(--line2);font-size:12px}
.vl b{font-weight:600;width:170px;flex:none}
.vl span{color:var(--muted);flex:1}
.hr{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:10px;padding:8px 0;border-bottom:1px solid var(--line2);font-size:12px}
.hr b{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.counts{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12px;margin-top:12px;color:var(--muted)}
.counts b{color:var(--ink);font-weight:600}
.assign{margin-top:12px;border-top:1px solid var(--ink)}
.arow{display:grid;grid-template-columns:84px minmax(0,1fr) minmax(0,1fr) 210px 28px;gap:10px;padding:6px 0;border-bottom:1px solid var(--line2);font-size:12px;align-items:center}
.arow.h{padding:10px 0;border-bottom:1px solid var(--line)}
.arow b{font-weight:600}
.arow>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:5px 6px}
.arow>span.empty{background:var(--sand)}
.arow>span:last-child{overflow:visible;text-overflow:clip;padding:0;text-align:center}
.sel{width:100%;font:inherit;font-size:12px;padding:5px 6px;border:1px solid var(--line);border-radius:3px;background:#fff}
.rides{margin-top:12px;border-top:1px solid var(--ink)}
.ride{display:grid;grid-template-columns:56px 1fr 1fr 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line2);align-items:center;font-size:12px}
.ride.h{padding:10px 0;border-bottom:1px solid var(--line)}
.ride b{font-weight:600}
.log{margin-top:12px;border-top:1px solid var(--ink)}
.log div{padding:9px 0;border-bottom:1px solid var(--line2);font-size:12px;line-height:1.5}
.log div span{color:var(--muted)}
.resp{margin-top:12px;border-top:1px solid var(--ink)}
.rrow{display:grid;grid-template-columns:64px 62px 62px 62px 1fr;gap:6px;padding:3px 0;border-bottom:1px solid var(--line2);font-size:11px;align-items:stretch}
.rrow.h{padding:10px 0;border-bottom:1px solid var(--line)}
.rrow>span{padding:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow>span.n{font-weight:600;padding:6px 0}
.rrow>span:last-child{white-space:normal}
.rrow>span.empty{background:var(--sand)}
.pnote{font-family:var(--serif);font-size:13px;line-height:1.5;color:var(--muted);margin-top:12px}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--card);font-size:12px;padding:10px 14px;border-radius:4px;z-index:20;max-width:90vw}
.toast.bare{bottom:20px}
.notice{position:fixed;left:50%;bottom:calc(57px + env(safe-area-inset-bottom));transform:translateX(-50%);width:100%;max-width:480px;background:var(--ink);color:var(--card);font-size:13px;line-height:1.4;padding:11px 20px;z-index:19}
.notice.bare{bottom:0;padding-bottom:calc(11px + env(safe-area-inset-bottom))}
.notice + .toast{bottom:calc(108px + env(safe-area-inset-bottom))}
.notice.bare + .toast.bare{bottom:calc(52px + env(safe-area-inset-bottom))}
.demo{position:fixed;right:10px;bottom:calc(66px + env(safe-area-inset-bottom));font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--accent);background:var(--card);border:1px solid var(--accent);padding:3px 8px;border-radius:999px;z-index:20;opacity:.9}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============================================================
   CONFIG: leave the key blank to run in demo mode (in-browser
   state, seeded, nothing leaves the phone).

// A stored pick is an option id, or "option:variant" for options with variants.
function parsePick(id) {
  if (!id) return null;
  const [oid, vid] = String(id).split(':');
  const opt = OPTS.find(o => o.id === oid);
  if (!opt) return null;
  const variant = opt.variants ? (opt.variants.find(v => v.id === vid) || opt.variants[0]) : null;
  return { opt, variant, id: opt.variants ? `${opt.id}:${variant.id}` : opt.id };
}
const pickKey = (o, vid) => o.variants ? `${o.id}:${vid || o.variants[0].id}` : o.id;
const optName = id => { const p = parsePick(id); return p ? (p.variant ? p.variant.name : p.opt.name) : ''; };
const pickCost = id => { const p = parsePick(id); return p && p.opt.pot === 'personal' ? (p.variant ? p.variant.cost : p.opt.cost) || 0 : 0; };
const isOpt = (id, o) => { const p = parsePick(id); return !!p && p.opt.id === o.id; };

// This person's picks: { 1: id, 2: id }. rankOf: which rank a card holds for them (0 if none). openRank: the first empty rank (0 if both taken).
const pickOf = (S, u, rank) => (S.picks[u] || {})[rank] || null;
const rankOf = (S, u, o) => RANKS.find(r => isOpt(pickOf(S, u, r), o)) || 0;
const openRank = (S, u) => RANKS.find(r => !pickOf(S, u, r)) || 0;
const hasBoth = (S, u) => RANKS.every(r => pickOf(S, u, r));
// What this person's Friday costs for now: the assignment once Bray has made it, else their 1st choice (or 2nd if that's all they have).
const fridayGuess = (S, u) => S.assigned[u] || pickOf(S, u, 1) || pickOf(S, u, 2) || null;

// Sort key for a time label: '' (a placeholder row) < Morning < clock times < Afternoon < Dark < Evening < Anytime.
const VAGUE = { '': -1, 'Morning': 6 * 60, 'Around noon': 12 * 60, 'Afternoon': 13 * 60, 'Dark': 17 * 60 + 30, 'Evening': 18 * 60, 'Anytime': 23 * 60 + 58 };
function minutes(t) {
  if (VAGUE[t] != null) return VAGUE[t];
  const m = /^(\d{1,2}):(\d{2})\s*(AM|PM)$/i.exec(String(t).trim());
  if (!m) return 23 * 60 + 57;
  let h = +m[1] % 12; if (/pm/i.test(m[3])) h += 12;
  return h * 60 + +m[2];
}

/* ============================================================
   STORES: both return the same normalized state from load():
   { picks, assigned, votes, meals, items, closed, log, rides }
   ============================================================ */
function normalize(rows) {
  const picks = {}, assigned = {}, votes = {}, meals = {}, closed = {}, rides = {};
  for (const r of rows.picks) if (r.option_id && RANKS.includes(+r.rank)) (picks[r.person] ||= {})[+r.rank] = r.option_id;
  for (const r of rows.assignments || []) if (r.option_id) assigned[r.person] = r.option_id;
  for (const r of rows.votes) (votes[r.vote_id] ||= {})[r.person] = r.choice_id;
  for (const m of MEALS) meals[m.key] = Object.fromEntries(ROLES.map(r => [r, []]));
  for (const r of rows.meals) { const m = meals[r.meal_key]; if (m && m[r.role] && !m[r.role].includes(r.person)) m[r.role].push(r.person); }
  for (const v of VOTES) votes[v.id] ||= {};
  for (const r of rows.voteState) closed[r.vote_id] = !!r.closed;
  for (const r of rows.settings || []) { try { rides[r.key] = JSON.parse(r.value); } catch { rides[r.key] = null; } }
  const items = rows.items.map(it => ({ ...it })).sort((a, b) => a.sort - b.sort || a.id.localeCompare(b.id));
  const log = rows.log.map(l => ({ text: l.text, when: fmtWhen(l.created_at) }));
  return { picks, assigned, votes, meals, items, closed, log, rides };
}

class SupabaseStore {
  constructor(url, key) {
    this.base = url.replace(/\/+$/, '') + '/rest/v1';
    this.headers = { apikey: key, Authorization: 'Bearer ' + key, 'Content-Type': 'application/json' };
  }
  async req(path, opts = {}) {
    const r = await fetch(this.base + path, { ...opts, headers: { ...this.headers, ...(opts.headers || {}) } });
    if (!r.ok) {
      let msg = `${r.status} ${r.statusText}`;
      try { const j = await r.json(); msg = j.message || j.hint || j.details || msg; } catch {}
      throw new Error(msg);
    }
    const t = await r.text();
    return t ? JSON.parse(t) : null;
  }
  get(path) { return this.req(path); }
  post(path, body, prefer) { return this.req(path, { method: 'POST', body: JSON.stringify(body), headers: prefer ? { Prefer: prefer } : {} }); }
  del(path) { return this.req(path, { method: 'DELETE', headers: { Prefer: 'return=minimal' } }); }
  rpc(fn, args) { return this.req('/rpc/' + fn, { method: 'POST', body: JSON.stringify(args) }); }
  async load() {
    const [picks, assignments, votes, meals, items, voteState, log, settings] = await Promise.all([
      this.get('/picks?select=person,rank,option_id'),
      this.get('/assignments?select=person,option_id'),
      this.get('/votes?select=vote_id,person,choice_id'),
      this.get('/meal_slots?select=meal_key,role,person&order=created_at'),
      this.get('/items_public?select=*&order=sort,id'),
      this.get('/vote_state?select=vote_id,closed'),
      this.get('/change_log?select=text,created_at&order=id.desc&limit=40'),
      this.get('/settings_public?select=key,value').catch(() => []),   // rides; tolerate a project that hasn't run the Round 3 SQL yet
    ]);
    return normalize({ picks, assignments, votes, meals, items, voteState, log, settings });
  }
  setPick(person, rank, id) {
    return id
      ? this.post('/picks', { person, rank, option_id: id, updated_at: new Date().toISOString() }, 'resolution=merge-duplicates,return=minimal')
      : this.del(`/picks?person=eq.${encodeURIComponent(person)}&rank=eq.${rank}`);
  }
  vote(vid, person, cid) { return this.post('/votes', { vote_id: vid, person, choice_id: cid, updated_at: new Date().toISOString() }, 'resolution=merge-duplicates,return=minimal'); }
  setMeal(key, role, person, on) {
    return on
      ? this.post('/meal_slots', { meal_key: key, role, person }, 'resolution=ignore-duplicates,return=minimal')
      : this.del(`/meal_slots?meal_key=eq.${encodeURIComponent(key)}&role=eq.${encodeURIComponent(role)}&person=eq.${encodeURIComponent(person)}`);
  }
  log(text) { return this.post('/change_log', { text }, 'return=minimal'); }
  verifyPin(pin) { return this.rpc('planner_verify', { p_pin: pin }); }
  plannerItems(pin) { return this.rpc('planner_items', { p_pin: pin }); }
  setStatus(pin, id, status, who) { return this.rpc('planner_set_status', { p_pin: pin, p_id: id, p_status: status, p_who: who }); }
  setConf(pin, id, conf) { return this.rpc('planner_set_conf', { p_pin: pin, p_id: id, p_conf: conf }); }
  closeVote(pin, vid, closed, who) { return this.rpc('planner_close_vote', { p_pin: pin, p_vote_id: vid, p_closed: closed, p_who: who }); }
  clearPick(pin, person, who) { return this.rpc('planner_clear_pick', { p_pin: pin, p_person: person, p_who: who }); }
  assign(pin, person, option, who) { return this.rpc('planner_assign', { p_pin: pin, p_person: person, p_option: option || null, p_who: who }); }
  setPin(pin, newPin) { return this.rpc('planner_set_pin', { p_pin: pin, p_new_pin: newPin }); }
  setSetting(pin, key, value) { return this.rpc('planner_set_setting', { p_pin: pin, p_key: key, p_value: value }); }
}

    ];
    this.voteState = { friday: false, saturday: false, sunday: false };

    this.logRows = [
      { id: 3, text: 'Manny changed Friday 1st choice: Snowshoe or cross-country ski → Snowmobile, own sled', created_at: ago(20) },

    ];

  async load() {
    return normalize({
      picks: Object.entries(this.picks).flatMap(([person, m]) => Object.entries(m).map(([rank, option_id]) => ({ person, rank: +rank, option_id }))),
      assignments: Object.entries(this.assignments).map(([person, option_id]) => ({ person, option_id })),
      votes: Object.entries(this.votes).flatMap(([vote_id, m]) => Object.entries(m).map(([person, choice_id]) => ({ vote_id, person, choice_id }))),
      meals: this.meals,
      items: this.items.map(({ conf, ...pub }) => pub),
      voteState: Object.entries(this.voteState).map(([vote_id, closed]) => ({ vote_id, closed })),
      settings: Object.entries(this.settings).map(([key, value]) => ({ key, value })),
      log: [...this.logRows].sort((a, b) => b.id - a.id).slice(0, 40),
    });
  }
  async setPick(person, rank, id) {
    const p = this.picks[person] ||= {};
    if (id) p[rank] = id; else delete p[rank];
    if (!Object.keys(p).length) delete this.picks[person];
    this.save();
  }
  async vote(vid, person, cid) { (this.votes[vid] ||= {})[person] = cid; this.save(); }
  async setMeal(key, role, person, on) {
    this.meals = this.meals.filter(m => !(m.meal_key === key && m.role === role && m.person === person));
    if (on) this.meals.push({ meal_key: key, role, person });
    this.save();
  }
  async log(text) { this.logRows.push({ id: this.nextId++, text, created_at: new Date().toISOString() }); this.save(); }
  check(pin) { if (pin !== this.pin) throw new Error('bad pin'); }
  async verifyPin(pin) { return pin === this.pin; }
  async plannerItems(pin) { this.check(pin); return this.items.map(it => ({ ...it })); }
  item(id) { const it = this.items.find(i => i.id === id); if (!it) throw new Error('no such item'); return it; }
  async setStatus(pin, id, status, who) { this.check(pin); const it = this.item(id); it.status = status; await this.log(`${who} marked ${it.item} ${status.toLowerCase()}`); }
  async setConf(pin, id, conf) { this.check(pin); this.item(id).conf = conf; this.save(); }
  async closeVote(pin, vid, closed, who) { this.check(pin); this.voteState[vid] = closed; await this.log(`${who} ${closed ? 'closed' : 'reopened'} the ${(VOTES.find(v => v.id === vid) || { title: vid }).title} vote`); }
  async clearPick(pin, person, who) { this.check(pin); delete this.picks[person]; await this.log(`${who} cleared ${person}’s Friday picks`); }
  async assign(pin, person, option, who) {
    this.check(pin);
    if (option) { this.assignments[person] = option; await this.log(`${who} assigned ${person} Friday: ${optName(option)}`); }
    else { delete this.assignments[person]; await this.log(`${who} cleared ${person}’s Friday assignment`); }
  }
  async setPin(pin, newPin) { this.check(pin); if (!/^[0-9]{4,8}$/.test(newPin)) throw new Error('PIN must be 4 to 8 digits'); this.pin = newPin; this.save(); }
  async setSetting(pin, key, value) { this.check(pin); this.settings[key] = value; this.save(); }
}

  variant: {},            // snowmobile radio per person, before they pick

  navTop: false,          // a tab or link was tapped: the next screen starts at the top (back/forward keeps its place)

  notice: '',             // a save that failed; stays on screen until a save succeeds
  loadNotice: '',         // the trip couldn't be loaded; stays until it can
};

// Routes: #/info · #/choose · #/me · #/planner · #/who. Old hashes keep working.
function route() {
  const h = (location.hash || '').replace(/^#\/?/, '').split('?')[0];
  const alias = { plan: 'info', trip: 'info', days: 'choose', mine: 'me' };
  const r = alias[h] || h;
  return ['info', 'choose', 'me', 'planner', 'who'].includes(r) ? r : '';
}
function go(r) { location.hash = '#/' + r; }

function say(msg) {
  app.toast = msg; render();
  clearTimeout(say.t); say.t = setTimeout(() => { app.toast = ''; render(); }, 4000);
}

let loadSeq = 0;
async function refresh() {
  const seq = ++loadSeq;
  try {
    const st = await store.load();
    let items = app.plannerItems;
    if (app.pin && route() === 'planner') {   // confirmation numbers are fetched only while the planner is on screen
      try { items = await store.plannerItems(app.pin); }
      catch (e) { if (/bad pin/i.test(e.message)) { app.pin = null; ss.set('breck-pin', null); items = null; } else throw e; }
    }
    if (seq !== loadSeq) return;   // a newer load is in flight; let it win instead of showing stale data
    app.state = st; app.plannerItems = route() === 'planner' ? items : null; app.loadNotice = '';
  } catch (e) { if (seq === loadSeq) app.loadNotice = 'Couldn’t load the trip. Check your signal.'; }
  render();
}

// Family action: show it at once, write it, log it, then re-read the truth. If the write fails, put the screen back and say so.
async function act(fn, logText, optimistic) {
  loadSeq++;   // a load already in flight is stale now: it must not overwrite the tap
  const before = app.state ? JSON.parse(JSON.stringify(app.state)) : null;
  if (optimistic && app.state) { optimistic(app.state); render(); }
  try {
    await fn();
    if (logText) { try { await store.log(logText); } catch {} }   // a lost log line never turns a saved pick into "didn't save"
    if (app.notice) { app.notice = ''; render(); }   // the bar goes the moment the save lands, not after the reload
  } catch (e) {
    if (before) app.state = before;
    app.notice = 'That didn’t save. Check your signal and tap again.';
    render();
  }
  await refresh();
}

// Which snowmobile variant the card should show for this person: their pick if they have one, else the radio they tapped, else the first.
function variantFor(S, u, o) {
  const r = rankOf(S, u, o);
  if (r) return parsePick(pickOf(S, u, r)).variant.id;
  return app.variant[u] || o.variants[0].id;
}
function priceHtml(o, cost) {
  if (o.pot === 'group') return 'In the $1,250';
  return `<span class="amt">${plus(cost)}</span><span class="ontop">on top</span>`;
}
const countOf = (S, o, rank) => PEOPLE.filter(p => isOpt(pickOf(S, p, rank), o)).length;

function buildOptions(S, u) {
  const age = AGES[u], kid = isKid(u), both = hasBoth(S, u), whose = kid ? `${u}’s` : 'Your';
  return OPTS.map(o => {
    const rank = rankOf(S, u, o), mine = rank > 0;
    const firsts = countOf(S, o, 1), seconds = countOf(S, o, 2);
    const vid = o.variants ? variantFor(S, u, o) : null;
    const variant = o.variants ? o.variants.find(v => v.id === vid) : null;
    let inel = '';
    if (o.minAge && age != null && age < o.minAge) inel = o.minAge >= 15 ? 'Adults only' : `Ages ${o.minAge} and up`;
    let btn;  // { label, cls, action | status | dis }
    if (inel) btn = { label: inel, cls: 'off', dis: true };
    else if (mine) btn = { label: `${whose} ${ord(rank)} choice`, cls: 'in', status: true, rank };
    else if (both) btn = { label: `${kid ? `${u}’s` : 'You’ve'} got 2 picks. Remove one to change.`, cls: 'off sent', dis: true };
    else btn = { label: kid ? `Pick this for ${u}` : 'Pick this', cls: kid ? 'kid' : '', action: 'pick', rank: openRank(S, u) };
    const radios = o.variants ? o.variants.map(v => ({
      ...v, on: v.id === vid, dis: !!(v.minAge && age != null && age < v.minAge),
      text: `${v.label} · ${plus(v.cost)}`,
    })) : null;
    return {
      ...o, mine, rank, inel, btn, radios, pickId: pickKey(o, vid),
      priceHtml: priceHtml(o, variant ? variant.cost : o.cost),
      going: `${firsts} first choice${firsts === 1 ? '' : 's'}, ${seconds} second`,
      deadline: o.due ? `Answer by ${o.due}` : '',
    };
  });
}

function buildVotes(S, u) {
  const kid = isKid(u);
  return VOTES.map(v => {
    const tally = v.choices.map(ch => ({ ...ch, count: ADULTS.filter(p => S.votes[v.id][p] === ch.id).length }));
    const total = tally.reduce((a, c) => a + c.count, 0) || 1;
    const max = Math.max(...tally.map(c => c.count));
    const winner = tally.find(c => c.count === max);
    const closed = !!S.closed[v.id], my = S.votes[v.id][u];
    const can = !closed && !kid;
    return {
      ...v, closed, winner, tally, can, my,
      right: closed ? `Decided: ${winner.label}` : kid ? '' : `Answer by ${v.closes}`,
      top: tally.filter(c => c.count === max), none: max === 0,
      choices: tally.map(c => ({ ...c, pct: Math.round(c.count / total * 100), my: c.id === my })),
    };
  });
}

// A night's sign-up shows only after Cook in has won that night's vote.
function mealsFor(S, votes, dayKey) {
  return MEALS.filter(m => {
    if (m.day !== dayKey) return false;
    const v = votes.find(v => v.id === m.needsVote);
    return v && v.closed && v.winner.id === 'cookin';
  });
}
// A closed vote becomes a locked row: the restaurant, or the cook-in at the Airbnb.
function decided(votes, dayKey) {
  return votes.filter(v => v.day === dayKey && v.closed)
    .map(v => ({ time: v.time, title: `${v.title}: ${v.winner.label}`, place: v.winner.place, bring: '', transport: v.winner.id === 'cookin' ? '' : 'Walk from the Airbnb' }));
}

// "Getting there" for an assigned Friday: the ride once the planner has set a leave time, otherwise a placeholder.
function rideLine(S, o) {
  if (!o.ride) return o.transport || '';
  const r = RIDES.find(x => x.key === (o.ride === 'suv' ? 'ride_suv' : 'ride_van'));
  const v = (S.rides || {})[r.key];
  if (!v || !v.leave) return RIDES_UNSET;
  return `${r.word} leaves the Airbnb ${v.leave}${v.driver ? `, ${v.driver} drives` : ''}`;
}

// What this person still owes the group. Kids only owe Friday picks (a parent taps them).
function todos(S, u) {
  const kid = isKid(u), out = [];
  if (!hasBoth(S, u)) out.push({ target: 'friday', label: kid ? `pick a 1st and 2nd choice for ${u}’s Friday` : 'pick a 1st and 2nd choice for Friday' });
  if (!kid) for (const v of VOTES) if (!S.closed[v.id] && !S.votes[v.id][u]) out.push({ target: 'vote-' + v.day, label: `vote on ${v.title}` });
  return out;
}

// Extras for an adult: their own Friday add-on plus their kids' (shown in full on each parent, not split).
function extrasFor(S, u) {
  const h = household(u) || { members: [u] };
  return h.members.filter(p => p === u || isKid(p)).reduce((a, p) => a + pickCost(fridayGuess(S, p)), 0);
}
function moneyLine(S, u) {
  if (isKid(u)) return 'With parents.';
  const x = extrasFor(S, u), total = PER_ADULT + x;
  const h = household(u) || { members: [u] };
  const sure = h.members.filter(p => p === u || isKid(p)).every(p => S.assigned[p] || !pickCost(fridayGuess(S, p)));
  return x ? `${money(PER_ADULT)} + ${money(x)} extras${sure ? '' : ' if the 1st choices go through'} = about ${money(total)}. Nothing due yet.` : `${money(PER_ADULT)}, no extras. Nothing due yet.`;
}

const KID_FLIGHT_TOTAL = Object.values(KID_FLIGHTS).reduce((a, b) => a + b, 0);

function render() {
  const r = route();
  let html;
  if (r === 'planner') html = viewPlanner();
  else if (!app.user || r === 'who') html = viewWho();
  else if (!app.state) html = shell(r || 'choose', '<div class="pad"><div class="lede">Loading…</div></div>');
  else if (r === 'info') html = shell('info', viewInfo());
  else if (r === 'me') html = shell('me', viewMe());
  else html = shell('choose', viewChoose());
  const bare = r === 'planner' || !app.user || r === 'who';   // no tab bar on these screens
  const notice = app.notice || app.loadNotice;
  if (notice) html += `<div class="notice ${bare ? 'bare' : ''}" role="alert">${esc(notice)}</div>`;
  if (app.toast) html += `<div class="toast ${bare ? 'bare' : ''}" role="status">${esc(app.toast)}</div>`;
  if (DEMO) html += '<div class="demo" title="No Supabase key set">Demo</div>';
  if (html !== app.lastHtml) {
    // Keep the cursor where it was: remember the focused box, redraw, then put focus, text and caret back.
    const prev = document.activeElement, focus = focusKey(prev);
    const y = window.scrollY;
    app.redrawing = true;
    document.getElementById('app').innerHTML = html;
    app.redrawing = false;
    app.lastHtml = html;
    window.scrollTo(0, y);
    if (focus) { const el = document.querySelector(focus.sel); if (el) { if (el.value !== focus.value) el.value = focus.value; el.focus(); try { el.setSelectionRange(focus.s, focus.e); } catch {} } }
    else if (r === 'planner' && !app.pin && (!prev || prev === document.body)) { const p = document.getElementById('pin'); if (p) p.focus(); }   // first paint of the gate only
  }
  if (app.jump) { const el = document.getElementById('sec-' + app.jump); app.jump = null; if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
}
// The box that has the cursor, as a selector that survives a redraw.
function focusKey(ae) {
  if (!ae || ae.tagName !== 'INPUT') return null;
  let sel = null;
  if (ae.id === 'pin') sel = '#pin';
  else if (ae.classList.contains('ride-in')) { const row = ae.closest('.ride'); if (row) sel = `.ride[data-ride="${row.dataset.ride}"] [data-field="${ae.dataset.field}"]`; }
  else if (ae.classList.contains('conf') && ae.dataset.id) sel = `.conf[data-id="${ae.dataset.id}"]`;
  return sel ? { sel, value: ae.value, s: ae.selectionStart, e: ae.selectionEnd } : null;
}

        ${c.desc ? `<div class="choice-d">${esc(c.desc)}</div>` : ''}
        <div class="meter"><i style="width:${c.pct}%"></i></div>
      </button>${c.url ? `<a class="ext" href="${esc(c.url)}" target="_blank" rel="noopener">Menu ↗</a>` : ''}</div>`).join('')}
    </div>`).join('')}</section>`;
    if (ms.length && !kid) out += `<div class="grp">${ms.map(m => mealHtml(S, m, u)).join('')}</div>`;
    return out + '</section>';
  }).join('');
  return head + days + '<div style="height:24px"></div>';
}

function cardHtml(o) {

function mealHtml(S, m, u) {

function viewMe() {
  const S = app.state, u = app.user, kid = isKid(u);
  const votes = buildVotes(S, u);
  const mk = (it, kind) => ({ ...it, kind });
  // A person's Friday row: the assigned option once Bray has made the call, else what they've picked so far.
  const fridayRow = (p, who) => {
    const fin = parsePick(S.assigned[p]);
    if (fin) return mk({ time: fin.opt.time, title: `${who === 'yours' ? 'Your' : who} Friday: ${optName(fin.id)}`, place: fin.opt.place, bring: fin.opt.bring, transport: rideLine(S, fin.opt) }, who);
    const a = pickOf(S, p, 1), b = pickOf(S, p, 2);
    const picks = a || b ? `${a ? `1st choice ${optName(a)}` : 'No 1st choice yet'}. ${b ? `2nd choice ${optName(b)}` : 'No 2nd choice yet'}.` : '';
    if (!hasBoth(S, p)) return mk({ time: '', title: picks ? `${who === 'yours' ? 'Your' : who} Friday picks` : `No Friday picks yet${who === 'yours' ? '' : ` for ${p}`}`, place: picks ? `${picks} ${who === 'yours' ? 'Tap Choose and pick the other.' : `Tap ${p}’s name on the roster and pick.`}` : who === 'yours' ? 'Tap Choose and pick a 1st and 2nd choice.' : `Tap ${p}’s name on the roster and pick a 1st and 2nd choice.`, bring: '', transport: '', href: who === 'yours' ? '#/choose' : '#/who' }, who);
    return mk({ time: '', title: FRIDAY_UNSET, place: picks, bring: '', transport: '' }, who);
  };
  const days = DAYS.map(d => {
    const items = [...(LOCKED[d.key] || []), ...decided(votes, d.key)].map(it => mk(it, ''));
    if (d.key === 'fri') {
      items.push(fridayRow(u, kid ? `${u}’s` : 'yours'));

      if (!kid) for (const k of (household(u) || { members: [] }).members.filter(isKid)) items.push(fridayRow(k, `${k}’s`));

    mealsFor(S, votes, d.key).forEach(m => ROLES.forEach(role => {

      items.push(mk({ time: m.time, title: `${m.title}, ${jobName(role)}`, place: 'the Airbnb kitchen', bring: '', transport: '' }, 'you’re on'));
    }));
    items.sort((a, b) => minutes(a.time) - minutes(b.time));

  </div>` + days.map(d => `<section class="itin"><div class="day-h"><span class="daynum">${d.num}</span><div><div class="dayname">${d.name}</div><div class="label daydate">${d.date}</div></div></div>

/* ============================================================
   EVENTS
   ============================================================ */
async function planner(fn) {
  try { await fn(app.pin, CONFIG.PLANNER); }
  catch (e) {
    if (/bad pin/i.test(e.message)) { app.pin = null; ss.set('breck-pin', null); app.plannerItems = null; app.pinErr = true; }
    say('That didn’t save: ' + e.message);
  }
  await refresh();
}

async function tryPin(v) {
  v = String(v || '').replace(/\D/g, '').slice(0, 8); app.pinDraft = v;
  if (v.length < 4) { app.pinErr = false; app.pinShort = true; render(); return; }
  app.pinShort = false;
  let ok = false;
  try { ok = await store.verifyPin(v) === true; }
  catch (e) { say('Couldn’t check the PIN. Check your signal.'); return; }   // a network miss is not a wrong PIN
  if (ok) { app.pin = v; ss.set('breck-pin', v); app.pinDraft = ''; app.pinErr = false; await refresh(); }
  else { app.pinErr = true; render(); const p = document.getElementById('pin'); if (p) p.focus(); }   // the digits stay in the box
}

// Set or clear one rank of a person's Friday picks. Never touches the other rank.
function setPick(u, rank, next, S) {
  const prev = pickOf(S, u, rank);
  if (prev === next) return;
  act(() => store.setPick(u, rank, next),
    next ? (prev ? `${u} changed Friday ${ord(rank)} choice: ${optName(prev)} → ${optName(next)}` : `${u} picked Friday ${ord(rank)} choice: ${optName(next)}`) : `${u} removed Friday ${ord(rank)} choice: ${optName(prev)}`,
    st => { const p = st.picks[u] ||= {}; if (next) p[rank] = next; else delete p[rank]; });
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.tagName === 'INPUT' || el.tagName === 'SELECT') return;
  const S = app.state, u = app.user, d = el.dataset;
  switch (d.act) {
    case 'signin': app.user = d.name; ls.set('breck-user', d.name); app.jump = S && !hasBoth(S, d.name) ? 'friday' : null; if (!app.jump) window.scrollTo(0, 0); history.replaceState(null, '', '#/choose'); render(); break;   // no history entry: back leaves the site cleanly
    case 'nav': {
      // A tab or link: the next screen starts at the top. Links back to the roster replace the entry, like sign-in, so back never lands on a stale Choose.
      if (el.getAttribute('href') === '#/who') { e.preventDefault(); history.replaceState(null, '', '#/who'); window.scrollTo(0, 0); app.pinDraft = ''; render(); break; }
      app.navTop = true; break;
    }
    case 'unlock': tryPin(app.pinDraft); break;
    case 'todo': app.jump = d.target; if (route() === 'choose') render(); else go('choose'); break;
    case 'pick': {
      // Fills the first empty rank. With both taken the button is disabled, so a pick never overrides another card.
      const rank = openRank(S, u), o = parsePick(d.opt);
      if (!rank || !o || rankOf(S, u, o.opt)) break;
      setPick(u, rank, o.id, S);
      break;
    }
    case 'unpick': setPick(u, +d.rank, null, S); break;
    case 'variant': {
      // Switching sleds re-picks the same rank if this person already has the snowmobile; otherwise it just sets the radio.
      const o = OPTS.find(o => o.id === d.opt), next = pickKey(o, d.variant), rank = rankOf(S, u, o);
      app.variant[u] = d.variant;
      if (rank) setPick(u, rank, next, S); else render();
      break;
    }
    case 'vote': act(() => store.vote(d.vote, u, d.choice), '', st => { st.votes[d.vote][u] = d.choice; }); break;
    case 'meal': {
      const on = d.on === '1', names = S.meals[d.meal][d.role];
      if (on && names.length >= SLOTS) return;
      act(() => store.setMeal(d.meal, d.role, u, on), `${u} ${on ? 'took' : 'dropped'} ${jobName(d.role)}, ${MEALS.find(m => m.key === d.meal).title}`,
        st => { st.meals[d.meal][d.role] = on ? [...names, u] : names.filter(n => n !== u); });
      break;
    }
    case 'status': planner((pin, who) => store.setStatus(pin, d.id, d.status, who)); break;
    case 'closevote': {
      if (d.closed === '1') {
        const v = buildVotes(S, CONFIG.PLANNER).find(v => v.id === d.vote);
        const names = v.top.map(c => c.label), tied = names.length > 2 ? names.slice(0, -1).join(', ') + ' and ' + names[names.length - 1] : names.join(' and ');
        const msg = v.none ? `Nobody has voted yet. Close as ${v.winner.label}?` : v.top.length > 1 ? `${tied} are tied at ${v.top[0].count}. Close as ${v.winner.label}?` : '';
        if (msg && !confirm(msg)) break;
      }
      planner((pin, who) => store.closeVote(pin, d.vote, d.closed === '1', who)); break;
    }
    case 'clearpick': {
      const a = pickOf(S, d.person, 1), b = pickOf(S, d.person, 2);
      if (confirm(`Clear ${d.person}’s Friday picks (${[a, b].filter(Boolean).map(optName).join(', ')})?`)) planner((pin, who) => store.clearPick(pin, d.person, who));
      break;
    }
    case 'changepin': {
      const v = (prompt('New PIN (4 to 8 digits)') || '').trim();
      if (!v) break;
      planner(async pin => { await store.setPin(pin, v); app.pin = v; ss.set('breck-pin', v); say('PIN changed.'); });
      break;
    }
    case 'lockplanner': app.pin = null; ss.set('breck-pin', null); app.plannerItems = null; app.pinDraft = ''; app.pinErr = false; app.pinShort = false; render(); break;
  }
});
// The Final dropdown in Assign Friday saves on change.
document.addEventListener('change', e => {
  const t = e.target;
  if (t.tagName === 'SELECT' && t.dataset.act === 'assign' && app.pin) planner((pin, who) => store.assign(pin, t.dataset.person, t.value || null, who));
});
document.addEventListener('input', e => {
  if (e.target.id === 'pin') {   // the PIN is checked on Enter or Unlock, never mid-typing
    const v = e.target.value.replace(/\D/g, '').slice(0, 8);
    e.target.value = v; app.pinDraft = v; app.pinShort = false;
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'pin') { e.preventDefault(); tryPin(e.target.value); }
  if (e.key === 'Enter' && e.target.classList.contains('conf')) e.target.blur();
});
// Planner boxes save when the person leaves them (Enter blurs). Saving on 'change' alone misses a value that a redraw put back into the box.
document.addEventListener('focusout', e => {
  if (app.redrawing) return;   // the box is being replaced by a redraw, not left by the person
  const t = e.target;
  if (!t || !t.classList || !app.pin) return;
  if (t.classList.contains('ride-in')) {
    // A ride row saves as one JSON value: { driver, leave, dest }; an unchanged row is not re-saved.
    const row = t.closest('.ride'); if (!row) return;
    const key = row.dataset.ride, v = {};
    row.querySelectorAll('input').forEach(i => { v[i.dataset.field] = i.value.trim(); });
    const prev = (app.state && app.state.rides[key]) || {};
    if (['driver', 'leave', 'dest'].every(f => (prev[f] || '') === v[f])) return;
    const word = RIDES.find(r => r.key === key).word;
    const said = [v.driver && `${v.driver} drives`, v.leave && `leaves ${v.leave}`, v.dest].filter(Boolean).join(', ') || 'cleared';
    // On a timeout so a Tab or click to the next box lands before the redraw.
    setTimeout(() => { if (app.pin) planner(async (pin, who) => { await store.setSetting(pin, key, JSON.stringify(v)); await store.log(`${who} sorted out the ${word} ride: ${said}`); }); }, 0);
  } else if (t.classList.contains('conf') && t.dataset.id) {
    const id = t.dataset.id, conf = t.value.trim();
    const cur = (app.plannerItems || []).find(i => i.id === id);
    if (cur && (cur.conf || '') === conf) return;
    setTimeout(() => { if (app.pin) planner(pin => store.setConf(pin, id, conf)); }, 0);
  }
});
history.scrollRestoration = 'manual';   // the page puts each screen back where it was (see below)
window.addEventListener('scroll', () => { app.pos[route() || 'choose'] = window.scrollY; }, { passive: true });
window.addEventListener('hashchange', () => {
  const r = route();
  if (r !== 'planner') { app.pinDraft = ''; app.pinErr = false; app.pinShort = false; app.plannerItems = null; }   // confirmation numbers live only on the planner screen
  const jumped = !!app.jump;   // a to-do link scrolls to its section; render() clears the flag
  if (app.navTop) window.scrollTo(0, 0);   // a tab or link starts at the top
  render();
  if (!app.navTop && !jumped) window.scrollTo(0, app.pos[r || 'choose'] || 0);   // back and forward return to where that screen was
  app.navTop = false;
  if (r === 'planner' && app.pin && !app.plannerItems) refresh();
});

render();
refresh();
setInterval(() => { if (!document.hidden) refresh(); }, CONFIG.POLL_MS);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
</script>
</body>
</html>
